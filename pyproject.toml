[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vorlo-trace"
version = "0.5.1"
description = "The debugger for AI agents — add 2 lines, replay every run, get the plain-English root cause and exact fix in 30 seconds."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Alan Joshy", email = "alan@vorlo.dev"},
]
keywords = [
    "ai", "agent", "observability", "debugging", "langchain",
    "openai-agents", "openai agents sdk", "tracing", "llm", "mcp",
    "step-replay", "vorlo",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "langchain-core>=0.1.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
async = ["httpx>=0.24.0"]
openai = ["openai-agents>=0.1.0"]
examples = [
    "langchain-openai>=0.1.0",
    "langgraph>=0.1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "httpx>=0.24.0",
]

[project.scripts]
vorlo-mcp = "vorlo_trace.mcp:main"

[project.urls]
Homepage = "https://vorlo.dev"
Documentation = "https://vorlo.dev/#how"

[tool.hatch.build.targets.wheel]
packages = ["src/vorlo_trace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
